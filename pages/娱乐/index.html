<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c49b55" />

  <title>The Mountain — Gorillaz</title>
  <meta name="description" content="Gorillaz 第九张录音室专辑《The Mountain》。选择你常用的音乐平台收听。" />

  <meta property="og:type" content="music.album" />
  <meta property="og:title" content="The Mountain — Gorillaz" />
  <meta property="og:description" content="选择你常用的音乐平台收听。" />
  <meta property="og:image" content="cover.webp" />

  <style>
    :root {
      color-scheme: dark;
      --paper: #e9d3a0;
      --ink: #17150f;
      --muted: rgba(255, 255, 255, 0.66);
      --line: rgba(255, 255, 255, 0.14);
      --glass: rgba(17, 20, 19, 0.72);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #fff;
      background: #111;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -8vh -8vw;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(5, 8, 8, 0.12), rgba(5, 8, 8, 0.86)),
        url("cover.webp") center / cover no-repeat;
      filter: blur(30px) saturate(0.82);
      transform: scale(1.08);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.16) 0 1px, transparent 1.5px);
      background-size: 11px 11px, 17px 17px;
      mix-blend-mode: soft-light;
    }

    main {
      width: min(100% - 32px, 940px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
    }

    .card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 30px;
      overflow: hidden;
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.92fr) minmax(320px, 1.08fr);
      min-height: 590px;
    }

    .art {
      position: relative;
      min-height: 520px;
      background: #171712;
    }

    .art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.26));
    }

    .content {
      padding: clamp(30px, 5vw, 58px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--paper);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 8vw, 78px);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .artist {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    .rule {
      width: 100%;
      height: 1px;
      margin: 30px 0 24px;
      background: var(--line);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .intro {
      margin: 0 0 30px;
      max-width: 39em;
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      line-height: 1.8;
    }

    .platforms {
      display: grid;
      gap: 12px;
    }

    .platform {
      min-height: 58px;
      padding: 0 19px;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.06);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .platform:hover,
    .platform:focus-visible {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.25);
      outline: none;
    }

    .platform strong {
      display: block;
      font-size: 15px;
      font-weight: 650;
    }

    .platform small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .arrow {
      font-size: 22px;
      line-height: 1;
      opacity: 0.7;
    }

    footer {
      margin-top: 24px;
      color: rgba(255,255,255,0.42);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      main { width: min(100% - 22px, 540px); }
      .card { border-radius: 24px; }
      .layout { grid-template-columns: 1fr; }
      .art { min-height: auto; aspect-ratio: 1 / 1; }
      .content { padding: 30px 24px 34px; }
      h1 { font-size: clamp(48px, 16vw, 72px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="card" aria-label="Gorillaz 专辑 The Mountain">
      <div class="layout">
        <div class="art">
          <img src="cover.webp" alt="Gorillaz《The Mountain》专辑封面" />
        </div>

        <section class="content">
          <p class="eyebrow">A listening page</p>
          <h1>The<br />Mountain</h1>
          <p class="artist">Gorillaz</p>

          <div class="rule"></div>

          <div class="meta" aria-label="专辑信息">
            <span>2026</span>
            <span>15 tracks</span>
            <span>1 hr 6 min</span>
          </div>

          <p class="intro">
            一张关于失去、转变与继续前行的专辑。选择你常用的平台，进入搜索结果后即可收听。
          </p>

          <nav class="platforms" aria-label="音乐平台">
            <a
              class="platform"
              href="https://y.qq.com/n/ryqq/search?w=Gorillaz%20The%20Mountain&t=album"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span>
                <strong>QQ 音乐</strong>
                <small>在 QQ 音乐中查找专辑</small>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a
              class="platform"
              href="https://music.163.com/#/search/m/?s=Gorillaz%20The%20Mountain&type=10"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span>
                <strong>网易云音乐</strong>
                <small>在网易云音乐中查找专辑</small>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </nav>

          <footer>Shared for listening · No ads · No tracking</footer>
        </section>
      </div>
    </article>
  </main>
</body>
</html>
