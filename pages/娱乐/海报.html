<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c49b55" />
  <title>The Mountain — Poster</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #e8d5a4;
      --paper-soft: rgba(232, 213, 164, 0.86);
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.12);
      --glass: rgba(14, 16, 15, 0.42);
      --glass-strong: rgba(17, 20, 19, 0.72);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #0e0f0f;
      color: #ffffff;
      overflow: hidden;
    }

    .poster {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      background: #111111;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: -8vh -8vw;
      z-index: -2;
      background:
        linear-gradient(
          180deg,
          rgba(7, 9, 10, 0.12),
          rgba(7, 9, 10, 0.78)
        ),
        url("cover.webp") center / cover no-repeat;
      filter: blur(34px) saturate(0.8);
      transform: scale(1.08);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        radial-gradient(circle at 20% 12%, rgba(255,255,255,0.20) 0 1px, transparent 1.5px),
        radial-gradient(circle at 78% 72%, rgba(255,255,255,0.12) 0 1px, transparent 1.5px);
      background-size: 12px 12px, 18px 18px;
      mix-blend-mode: soft-light;
    }

    .frame {
      min-height: 100svh;
      padding:
        max(28px, env(safe-area-inset-top))
        clamp(22px, 4vw, 54px)
        max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .top {
      display: flex;
      justify-content: center;
      padding-top: clamp(4px, 2vh, 20px);
    }

    .cover-wrap {
      width: min(58vw, 450px);
      aspect-ratio: 1 / 1;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transform: rotate(-3deg);
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 22px;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 24px;
    }

    .text {
      max-width: 640px;
      padding-bottom: 4px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--paper);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(64px, 11vw, 148px);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .artist {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 22px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .qr {
      justify-self: end;
    }

    .qr-shell {
      width: clamp(132px, 18vw, 196px);
      padding: 14px;
      border-radius: 24px;
      background: var(--paper-soft);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .qr-shell img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    @media (max-width: 760px) {
      .frame {
        gap: 20px;
      }

      .top {
        justify-content: flex-start;
      }

      .cover-wrap {
        width: min(72vw, 360px);
        transform: rotate(-2deg);
      }

      .bottom {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .qr {
        margin-left: auto;
      }

      .qr-shell {
        width: 150px;
        padding: 12px;
      }

      h1 {
        font-size: clamp(60px, 18vw, 110px);
      }

      .artist {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
